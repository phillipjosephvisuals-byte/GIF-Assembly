  <style>
    /* Top Navigation Bar */
    .nav-bar {
      position: sticky;

<body>

  <!-- Top Navigation Bar -->
  <nav class="nav-bar">

    <div class="nav-links">
      <a href="#" class="nav-link active">Media Converter</a>

  <div class="main-container">
    <!-- SECTION 1: VIDEO TO GIF CONVERTER -->
    <div class="card">
      <h2>Video to GIF Converter</h2>
      
      <div class="field">
        <label for="videoInput">Upload Video Files (Up to 3)</label>
        <input type="file" id="videoInput" accept="video/*" multiple>
      </div>

      <div id="clipList"></div>

      <div id="meterPanel" class="meter-panel" style="display:none;">

        <div class="meter-details">

    <!-- SECTION 2: DOCUMENT & IMAGE CONVERTER -->
    <div class="card">
      <h2>Document & Image Converter</h2>
      
      <div class="field">
        <label for="docInput">Upload File (.pdf, .jpg, .png, .tiff)</label>
        <input type="file" id="docInput" accept="application/pdf, image/*, .tiff, .tif">
      </div>

      <div id="docPanel" class="doc-panel">
        <div id="selectedFileName" style="font-weight: 600; margin-bottom: 12px; color: #475569;">Selected: -</div>
        
        <div class="doc-row">
          <div class="field">
            <label for="formatSelect">Convert To</label>
            <select id="formatSelect">
              <option value="image/webp">WebP Images</option>
              <option value="image/jpeg">JPEG Images</option>
              <option value="image/png">PNG Images</option>
              <option value="application/pdf">PDF Document</option>
            </select>
          </div>

          <div class="size-badges-row">
            <span class="badge badge-orig">Original: <span id="origSize">0 MB</span></span>
            <span class="badge badge-est">Est. Output: <span id="estSize">0 MB</span></span>
          </div>
        </div>

        <div class="field">
          <div class="slider-header">
            <span>Compression Quality</span>
            <span id="qualityVal">80%</span>
          </div>
          <input type="range" id="qualitySlider" min="10" max="100" value="80">
        </div>

        <div class="field">
          <div class="slider-header">
            <span>Resolution / Scale</span>
            <span id="scaleVal">100%</span>
          </div>
          <input type="range" id="scaleSlider" min="20" max="100" value="100">
        </div>

        <button id="convertDocBtn" style="margin-top: 12px;">Convert File</button>
      </div>

      <div id="docStatus" class="status-text"></div>

      <div id="docPreviewContainer" class="preview-container">
        <h3>Converted Result Preview</h3>
        <img id="docOutputImg" alt="Converted Output">
        <a id="docDownloadLink" class="download-btn" download="converted">Download Converted File</a>
      </div>
    </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script>
    /* =========================================================
       SECTION 1: VIDEO TO GIF CONVERTER LOGIC
       ========================================================= */
    const MAX_FRAMES = 100;
    const TARGET_FPS = 10;

    const videoInput = document.getElementById('videoInput');
    const clipList = document.getElementById('clipList');
    const meterPanel = document.getElementById('meterPanel');
    const statusIndicator = document.getElementById('statusIndicator');
    const frameBudgetLabel = document.getElementById('frameBudgetLabel');
    const meterFill = document.getElementById('meterFill');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const previewContainer = document.getElementById('preview-container');
    const gifOutput = document.getElementById('gifOutput');
    const downloadLink = document.getElementById('downloadLink');

    let clips = [];

    videoInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).slice(0, 3);
      if (!files.length) return;

      clips.forEach(c => URL.revokeObjectURL(c.url));
      clips = [];
      clipList.innerHTML = '';

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const url = URL.createObjectURL(file);
        const video = document.createElement('video');
        video.src = url;
        video.preload = 'auto';
        video.muted = true;

        await new Promise(resolve => video.onloadedmetadata = resolve);

        const clip = {
          id: 'clip-' + Date.now() + '-' + i,
          file, url, video,
          duration: video.duration,
          startPct: 0, endPct: 1
        };

        clips.push(clip);
        renderClipCard(clip);
      }

      meterPanel.style.display = 'flex';
      convertBtn.disabled = false;
      updateBudgetMeter();
    });

    function renderClipCard(clip) {
      const card = document.createElement('div');
      card.className = 'clip-card';
      card.draggable = true;
      card.dataset.id = clip.id;

      card.innerHTML = `
        <div class="clip-header">
          <span>⋮⋮ ${clip.file.name}</span>
          <span class="clip-time-info">0.0s - ${clip.duration.toFixed(1)}s</span>
        </div>
        <div class="filmstrip-container">
          <canvas class="filmstrip-canvas"></canvas>
          <div class="trimmer-overlay">
            <div class="handle handle-left"></div>
            <div class="handle handle-right"></div>
          </div>
        </div>
      `;

      clipList.appendChild(card);
      setupDragAndDrop(card);
      setupTrimmer(card, clip);
      generateFilmstrip(card, clip);
    }

    async function generateFilmstrip(card, clip) {
      const canvas = card.querySelector('.filmstrip-canvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width || 600;
      canvas.height = rect.height || 50;

      const thumbCount = 8;
      const thumbWidth = canvas.width / thumbCount;
      const step = clip.duration / thumbCount;

      for (let i = 0; i < thumbCount; i++) {
        clip.video.currentTime = i * step;
        await new Promise(r => clip.video.onseeked = r);
        ctx.drawImage(clip.video, i * thumbWidth, 0, thumbWidth, canvas.height);
      }
    }

    function setupTrimmer(card, clip) {
      const container = card.querySelector('.filmstrip-container');
      const overlay = card.querySelector('.trimmer-overlay');
      const handleL = card.querySelector('.handle-left');
      const handleR = card.querySelector('.handle-right');
      const timeInfo = card.querySelector('.clip-time-info');

      let isDragging = false, dragType = null, startX = 0, startStartPct = 0, startEndPct = 1;

      const onMouseDown = (e, type) => {
        e.stopPropagation();
        isDragging = true; dragType = type; startX = e.clientX;
        startStartPct = clip.startPct; startEndPct = clip.endPct;
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      };

      handleL.addEventListener('mousedown', (e) => onMouseDown(e, 'left'));
      handleR.addEventListener('mousedown', (e) => onMouseDown(e, 'right'));
      overlay.addEventListener('mousedown', (e) => {
        if (e.target === handleL || e.target === handleR) return;
        onMouseDown(e, 'move');
      });

      function onMouseMove(e) {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        const deltaPct = (e.clientX - startX) / rect.width;

        if (dragType === 'left') {
          clip.startPct = Math.max(0, Math.min(startStartPct + deltaPct, clip.endPct - 0.05));
        } else if (dragType === 'right') {
          clip.endPct = Math.min(1, Math.max(startEndPct + deltaPct, clip.startPct + 0.05));
        } else if (dragType === 'move') {
          const width = startEndPct - startStartPct;
          let newStart = startStartPct + deltaPct;
          let newEnd = startEndPct + deltaPct;
          if (newStart < 0) { newStart = 0; newEnd = width; }
          if (newEnd > 1) { newEnd = 1; newStart = 1 - width; }
          clip.startPct = newStart; clip.endPct = newEnd;
        }

        updateOverlayUI(); updateBudgetMeter();
      }

      function onMouseUp() {
        isDragging = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }

      function updateOverlayUI() {
        overlay.style.left = (clip.startPct * 100) + '%';
        overlay.style.width = ((clip.endPct - clip.startPct) * 100) + '%';
        timeInfo.textContent = `${(clip.startPct * clip.duration).toFixed(1)}s - ${(clip.endPct * clip.duration).toFixed(1)}s`;
      }
    }

    function setupDragAndDrop(card) {
      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', card.dataset.id);
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        reorderClipsArray();
      });
      clipList.addEventListener('dragover', (e) => {
        e.preventDefault();
        const draggingCard = document.querySelector('.dragging');
        const siblings = [...clipList.querySelectorAll('.clip-card:not(.dragging)')];
        const nextSibling = siblings.find(sibling => e.clientY <= sibling.getBoundingClientRect().top + sibling.offsetHeight / 2);
        if (nextSibling) clipList.insertBefore(draggingCard, nextSibling);
        else clipList.appendChild(draggingCard);
      });
    }

    function reorderClipsArray() {
      const cardElements = [...clipList.querySelectorAll('.clip-card')];
      clips = cardElements.map(el => clips.find(c => c.id === el.dataset.id));
    }

    function updateBudgetMeter() {
      let totalSeconds = 0;
      clips.forEach(clip => { totalSeconds += (clip.endPct - clip.startPct) * clip.duration; });

      const totalFramesNeeded = Math.round(totalSeconds * TARGET_FPS);
      const percentage = Math.min(100, Math.round((totalFramesNeeded / MAX_FRAMES) * 100));

      frameBudgetLabel.textContent = `${totalFramesNeeded} / ${MAX_FRAMES} Frames (${totalSeconds.toFixed(1)}s total)`;
      meterFill.style.width = `${percentage}%`;

      if (totalFramesNeeded <= MAX_FRAMES) {
        statusIndicator.style.backgroundColor = '#16a34a';
        meterFill.style.backgroundColor = '#2563eb';
        convertBtn.disabled = false;
        status.textContent = 'Ready to convert.';
      } else {
        statusIndicator.style.backgroundColor = '#dc2626';
        meterFill.style.backgroundColor = '#dc2626';
        convertBtn.disabled = true;
        status.textContent = 'Selected sections exceed frame budget. Shrink clip windows.';
      }
    }

    convertBtn.addEventListener('click', async () => {
      convertBtn.disabled = true;
      status.textContent = 'Processing frames...';
      previewContainer.style.display = 'none';

      const firstVideo = clips[0].video;
      const targetWidth = 410;
      const targetHeight = Math.round(targetWidth * (firstVideo.videoHeight / firstVideo.videoWidth));

      hiddenCanvas.width = targetWidth;
      hiddenCanvas.height = targetHeight;
      const ctx = hiddenCanvas.getContext('2d');

      const workerBlob = new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');`], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(workerBlob);

      const gif = new GIF({ workers: 2, quality: 10, width: targetWidth, height: targetHeight, workerScript: workerUrl });
      const stepTime = 1 / TARGET_FPS;

      for (let i = 0; i < clips.length; i++) {
        const clip = clips[i];
        let currentTime = clip.startPct * clip.duration;
        const endTime = clip.endPct * clip.duration;

        while (currentTime < endTime) {
          clip.video.currentTime = currentTime;
          await new Promise(r => clip.video.onseeked = r);
          ctx.drawImage(clip.video, 0, 0, targetWidth, targetHeight);
          gif.addFrame(ctx, { copy: true, delay: 100 });
          currentTime += stepTime;
          status.textContent = `Extracting frames (Clip ${i + 1} of ${clips.length})...`;
        }
      }

      status.textContent = 'Rendering GIF...';
      gif.on('finished', (blob) => {
        const gifUrl = URL.createObjectURL(blob);
        gifOutput.src = gifUrl;
        downloadLink.href = gifUrl;
        previewContainer.style.display = 'block';
        status.textContent = 'Conversion complete!';
        convertBtn.disabled = false;
        URL.revokeObjectURL(workerUrl);
      });
      gif.render();
    });

    /* =========================================================
       SECTION 2: DOCUMENT & IMAGE CONVERTER (PDF, TIFF, IMAGES)
       ========================================================= */
    const docInput = document.getElementById('docInput');
    const docPanel = document.getElementById('docPanel');
    const selectedFileName = document.getElementById('selectedFileName');
    const formatSelect = document.getElementById('formatSelect');
    const qualitySlider = document.getElementById('qualitySlider');
    const scaleSlider = document.getElementById('scaleSlider');
    const qualityVal = document.getElementById('qualityVal');
    const scaleVal = document.getElementById('scaleVal');
    const origSize = document.getElementById('origSize');
    const estSize = document.getElementById('estSize');
    const convertDocBtn = document.getElementById('convertDocBtn');
    const docStatus = document.getElementById('docStatus');
    const docPreviewContainer = document.getElementById('docPreviewContainer');
    const docOutputImg = document.getElementById('docOutputImg');
    const docDownloadLink = document.getElementById('docDownloadLink');

    let currentDocFile = null;
    let loadedPages = [];

    docInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      currentDocFile = file;
      selectedFileName.textContent = `Selected: ${file.name}`;
      origSize.textContent = formatBytes(file.size);
      docPanel.style.display = 'block';
      docPreviewContainer.style.display = 'none';
      docStatus.textContent = 'Parsing file...';

      loadedPages = [];
      const ext = file.name.split('.').pop().toLowerCase();

      if (file.type === 'application/pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          loadedPages.push(page);
        }
        docStatus.textContent = `PDF Loaded (${loadedPages.length} Pages).`;
      } else if (ext === 'tiff' || ext === 'tif') {
        const arrayBuffer = await file.arrayBuffer();
        const ifds = UTIF.decode(arrayBuffer);
        for (let i = 0; i < ifds.length; i++) {
          UTIF.decodeImage(arrayBuffer, ifds[i]);
          const rgba = UTIF.toRGBA8(ifds[i]);
          const canvas = document.createElement('canvas');
          canvas.width = ifds[i].width;
          canvas.height = ifds[i].height;
          const ctx = canvas.getContext('2d');
          const imgData = ctx.createImageData(canvas.width, canvas.height);
          imgData.data.set(rgba);
          ctx.putImageData(imgData, 0, 0);
          loadedPages.push(canvas);
        }
        docStatus.textContent = `TIFF Image Loaded (${loadedPages.length} Frames).`;
      } else {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(r => img.onload = r);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        loadedPages.push(canvas);
        docStatus.textContent = 'Image Loaded.';
      }

      estimateOutputSize();
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function estimateOutputSize() {
      qualityVal.textContent = `${qualitySlider.value}%`;
      scaleVal.textContent = `${scaleSlider.value}%`;

      if (!loadedPages.length) return;

      const quality = parseFloat(qualitySlider.value) / 100;
      const scale = parseFloat(scaleSlider.value) / 100;
      const targetFormat = formatSelect.value;

      const tempCanvas = document.createElement('canvas');
      const ctx = tempCanvas.getContext('2d');
      const page1 = loadedPages[0];

      if (currentDocFile.type === 'application/pdf') {
        const viewport = page1.getViewport({ scale });
        tempCanvas.width = viewport.width;
        tempCanvas.height = viewport.height;
        await page1.render({ canvasContext: ctx, viewport }).promise;
      } else {
        tempCanvas.width = page1.width * scale;
        tempCanvas.height = page1.height * scale;
        ctx.drawImage(page1, 0, 0, tempCanvas.width, tempCanvas.height);
      }

      if (targetFormat === 'application/pdf') {
        const baseSize = tempCanvas.width * tempCanvas.height * 0.2 * quality * loadedPages.length;
        estSize.textContent = formatBytes(baseSize);
      } else {
        tempCanvas.toBlob((blob) => {
          if (blob) {
            estSize.textContent = formatBytes(blob.size * loadedPages.length);
          }
        }, targetFormat, quality);
      }
    }

    qualitySlider.addEventListener('input', estimateOutputSize);
    scaleSlider.addEventListener('input', estimateOutputSize);
    formatSelect.addEventListener('change', estimateOutputSize);

    convertDocBtn.addEventListener('click', async () => {
      convertDocBtn.disabled = true;
      docStatus.textContent = 'Converting file...';
      docPreviewContainer.style.display = 'none';

      const quality = parseFloat(qualitySlider.value) / 100;
      const scale = parseFloat(scaleSlider.value) / 100;
      const targetFormat = formatSelect.value;
      const ext = targetFormat.split('/')[1];

      const renderCanvas = async (page) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        if (currentDocFile.type === 'application/pdf') {
          const viewport = page.getViewport({ scale });
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: ctx, viewport }).promise;
        } else {
          canvas.width = page.width * scale;
          canvas.height = page.height * scale;
          ctx.drawImage(page, 0, 0, canvas.width, canvas.height);
        }
        return canvas;
      };

      if (targetFormat === 'application/pdf') {
        const { jsPDF } = window.jspdf;
        let pdfDocOut = null;

        for (let i = 0; i < loadedPages.length; i++) {
          docStatus.textContent = `Adding page ${i + 1} of ${loadedPages.length} to PDF...`;
          const canvas = await renderCanvas(loadedPages[i]);
          const imgData = canvas.toDataURL('image/jpeg', quality);
          const orientation = canvas.width > canvas.height ? 'l' : 'p';

          if (i === 0) {
            pdfDocOut = new jsPDF(orientation, 'px', [canvas.width, canvas.height]);
            pdfDocOut.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
          } else {
            pdfDocOut.addPage([canvas.width, canvas.height], orientation);
            pdfDocOut.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
          }
        }

        const pdfBlob = pdfDocOut.output('blob');
        const pdfUrl = URL.createObjectURL(pdfBlob);
        docOutputImg.style.display = 'none';
        docDownloadLink.href = pdfUrl;
        docDownloadLink.download = 'converted.pdf';
        docDownloadLink.textContent = 'Download PDF Document';
        docPreviewContainer.style.display = 'block';
        docStatus.textContent = 'PDF conversion complete!';
      } else if (loadedPages.length === 1) {
        const canvas = await renderCanvas(loadedPages[0]);
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          docOutputImg.src = url;
          docOutputImg.style.display = 'block';
          docDownloadLink.href = url;
          docDownloadLink.download = `converted.${ext}`;
          docDownloadLink.textContent = `Download ${ext.toUpperCase()}`;
          docPreviewContainer.style.display = 'block';
          docStatus.textContent = 'Conversion complete!';
        }, targetFormat, quality);
      } else {
        const zip = new JSZip();
        for (let i = 0; i < loadedPages.length; i++) {
          docStatus.textContent = `Converting page ${i + 1} of ${loadedPages.length}...`;
          const canvas = await renderCanvas(loadedPages[i]);
          const blob = await new Promise(r => canvas.toBlob(r, targetFormat, quality));
          zip.file(`page-${i + 1}.${ext}`, blob);
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const zipUrl = URL.createObjectURL(zipBlob);
        docOutputImg.style.display = 'none';
        docDownloadLink.href = zipUrl;
        docDownloadLink.download = `converted_pages_${ext}.zip`;
        docDownloadLink.textContent = 'Download All Pages (ZIP)';
        docPreviewContainer.style.display = 'block';
        docStatus.textContent = 'All pages converted and zipped!';
      }

      convertDocBtn.disabled = false;
    });
  </script>
</body>
</html>
